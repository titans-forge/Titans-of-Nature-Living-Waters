name: Game source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-media-provenance.mjs --recorded-sources
      - run: npm test
      - run: npm run build
      - run: node scripts/stage-release-licenses.mjs --check
